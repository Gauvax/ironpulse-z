<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Synthèse Vocale — Résumé de la Session IronPulse Z</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080B11;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #F8FAFC;
    }
    .card {
      background: #111827;
      border: 1px solid rgba(245, 158, 11, 0.4);
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.15);
      border-radius: 20px;
      padding: 32px;
      max-width: 540px;
      width: 90%;
      text-align: center;
    }
    h1 {
      font-size: 20px;
      color: #F59E0B;
      margin-bottom: 8px;
    }
    p {
      color: #94A3B8;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 24px;
      text-align: left;
    }
    .btn-play {
      background: linear-gradient(135deg, #F59E0B, #EA580C);
      color: #0B0F19;
      border: none;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-play:hover {
      opacity: 0.95;
      transform: scale(1.02);
    }
    .btn-play:active {
      transform: scale(0.98);
    }
    .audio-player {
      margin-top: 24px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 40px; margin-bottom: 12px;">🎙️⚡</div>
    <h1>Synthèse Vocale de la Session</h1>
    <p>
      Écoutez le résumé audio complet avec la voix française naturelle haute définition de Google Chrome, ou écoutez directement le fichier WAV généré sur votre ordinateur.
    </p>

    <button id="btnSpeech" class="btn-play">
      <span id="playIcon">▶️</span> <span id="btnText">Écouter la Synthèse Vocale HD</span>
    </button>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #1E293B;">
      <div style="font-size: 11px; color: #64748B; margin-bottom: 8px;">Lecteur du fichier WAV généré :</div>
      <audio class="audio-player" controls src="./synthese_vocale_session.wav"></audio>
    </div>
  </div>

  <script>
    const textToSpeak = `
      Bonjour ! Voici le résumé vocal de votre session de développement sur IronPulse Z.
      Premièrement, nous avons séparé proprement votre espace de travail en deux dossiers distincts : le dossier IronPulse pour l'application cliente et la 3D, et le dossier Antigravity pour le serveur MCP, le PRD et la sécurité.
      Deuxièmement, la personnalisation Manga complète est désormais en place avec le choix du sexe Guerrier ou Guerrière Valkyrie, six teintes de peau, cinq coiffures 3D, sept couleurs de transformation et les regards avec lueur de Ki.
      Troisièmement, nous avons installé deux compétences graphiques avancées pour vos futurs sprites : manga character craft et anime FX animator.
      Quatrièmement, nous avons appliqué la roadmap avec les effets sonores procéduraux du Scouter et du Ki, les transitions 3D fluides, la sauvegarde et restauration JSON pour sécuriser vos données, et le fonctionnement hors-ligne total grâce au Service Worker.
      Toutes vos modifications sont prêtes et synchronisées !
    `;

    const btn = document.getElementById('btnSpeech');
    const playIcon = document.getElementById('playIcon');
    const btnText = document.getElementById('btnText');
    let isSpeaking = false;

    btn.addEventListener('click', () => {
      if (!('speechSynthesis' in window)) {
        alert("La synthèse vocale n'est pas supportée dans ce navigateur.");
        return;
      }

      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        playIcon.textContent = '▶️';
        btnText.textContent = 'Écouter la Synthèse Vocale HD';
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'fr-FR';
      utterance.rate = 1.05;
      utterance.pitch = 1.0;

      // Sélectionner une voix française si disponible
      const voices = window.speechSynthesis.getVoices();
      const frVoice = voices.find(v => v.lang.startsWith('fr') && (v.name.includes('Google') || v.name.includes('Hortense') || v.name.includes('Julie'))) || voices.find(v => v.lang.startsWith('fr'));
      if (frVoice) {
        utterance.voice = frVoice;
      }

      utterance.onend = () => {
        isSpeaking = false;
        playIcon.textContent = '▶️';
        btnText.textContent = 'Réécouter la Synthèse Vocale HD';
      };

      utterance.onerror = () => {
        isSpeaking = false;
        playIcon.textContent = '▶️';
        btnText.textContent = 'Écouter la Synthèse Vocale HD';
      };

      window.speechSynthesis.speak(utterance);
      isSpeaking = true;
      playIcon.textContent = '⏹️';
      btnText.textContent = 'Arrêter la lecture';
    });

    // Auto-démarrage si désiré après chargement des voix
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {};
    }
  </script>
</body>
</html>
