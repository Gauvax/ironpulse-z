    function sanitizeDOMAndAssets() {
      var root = document.getElementById('app-root');
      if (!root) return;
      var imgs = root.querySelectorAll('img');
      for (var i = 0; i < imgs.length; i++) {
        var s = imgs[i].getAttribute('src') || '';
        if (s.indexOf('hero-berserker') !== -1 || s.indexOf('hero-air-focus') !== -1 || s.indexOf('hero-original-athlete') !== -1) {
          imgs[i].setAttribute('src', './src/assets/hero-anime-original.svg');
        }
      }
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
      var node;
      while ((node = walker.nextNode())) {
        var val = node.nodeValue;
        if (val && val.length > 2) {
          var changed = false;
          for (var j = 0; j < CLEAN_MAP.length; j++) {
            if (CLEAN_MAP[j][0].test(val)) {
              val = val.replace(CLEAN_MAP[j][0], CLEAN_MAP[j][1]);
              changed = true;
            }
          }
          if (changed) node.nodeValue = val;
        }
      }
      if (window.__current_tab === 'rpg') {
        var mainEl = document.querySelector('#app-root main');

    function bindHero3DParallaxTilt() {
      var stage = document.getElementById('hero-interactive-stage');
      if (!stage || stage.dataset.tiltBound === 'true') return;
      stage.dataset.tiltBound = 'true';
      stage.style.perspective = '900px';

      function onMove(e) {
        var rect = stage.getBoundingClientRect();
        var clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : null);
        var clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : null);
        if (clientX === null || clientY === null) return;
        var x = (clientX - rect.left) / rect.width - 0.5;
        var y = (clientY - rect.top) / rect.height - 0.5;
        var img = stage.querySelector('.altr-animated-hero');
        if (img) {
          img.style.transform = 'perspective(900px) rotateY(' + (x * 18).toFixed(1) + 'deg) rotateX(' + (-y * 14).toFixed(1) + 'deg) translate3d(' + (x * 10).toFixed(1) + 'px, ' + (y * 6).toFixed(1) + 'px, 16px)';
        }
      }
      function onLeave() {
        var img = stage.querySelector('.altr-animated-hero');
        if (img) {
          img.style.transform = '';
        }
      }
      stage.addEventListener('mousemove', onMove);

      app.updatePlateCalcView = function(wVal, bVal) {
        if (wVal !== null && wVal !== undefined) window.__plate_target = Math.max(0, Number(wVal) || 0);
        if (bVal !== null && bVal !== undefined) window.__plate_bar = Number(bVal) || 20;
        var box = document.getElementById('ipz-plate-visual');
        if (!box) return;
        var total = window.__plate_target;
        var bar = window.__plate_bar;
        var perSide = Math.max(0, (total - bar) / 2);
        var rem = perSide;
        var specs = [
          { w: 25, col: '#EF4444', h: 96, txt: '#fff' },
          { w: 20, col: '#2563EB', h: 92, txt: '#fff' },
          { w: 15, col: '#EAB308', h: 82, txt: '#000' },
          { w: 10, col: '#16A34A', h: 74, txt: '#fff' },
          { w: 5,  col: '#F8FAFC', h: 62, txt: '#000' },
          { w: 2.5,col: '#334155', h: 52, txt: '#fff' },
          { w: 1.25,col:'#94A3B8', h: 44, txt: '#000' }
        ];
        var chosen = [];
        var summary = [];
        for (var i = 0; i < specs.length; i++) {
          var count = Math.floor((rem + 0.001) / specs[i].w);
          if (count > 0) {
            summary.push(count + ' × ' + specs[i].w + ' kg');
            for (var c = 0; c < count; c++) chosen.push(specs[i]);
            rem = Math.round((rem - count * specs[i].w) * 100) / 100;
          }
        }
        var platesHtml = chosen.length ? chosen.map(function(p) {
          return '<div style="height:' + p.h + 'px;background:' + p.col + ';color:' + p.txt + ';" class="w-6 rounded-md border border-white/25 flex items-center justify-center font-mono text-[9px] font-black shadow-md shrink-0">' + p.w + '</div>';
        }).join('') : '<span class="text-xs text-slate-400 font-bold">Barre à vide uniquement</span>';

        box.innerHTML = '<div class="flex items-center justify-between text-xs font-bold">' +
          '<span class="text-slate-400">À charger <strong class="text-cyan-300">PAR CÔTÉ</strong> :</span>' +
          '<span class="font-mono text-sm font-black text-amber-300">' + perSide.toFixed(2).replace(/\.00$/, '') + ' kg / côté</span>' +
          '</div>' +
          '<div class="relative h-28 flex items-center justify-center bg-slate-950/90 rounded-xl border border-slate-800/80 px-3 overflow-x-auto">' +
          '  <div class="w-10 h-3 bg-slate-500 rounded-l-full shrink-0"></div>' +
          '  <div class="w-3 h-7 bg-slate-400 rounded-sm shrink-0 mr-1"></div>' +
          '  <div class="flex items-center gap-1">' + platesHtml + '</div>' +
          '  <div class="w-8 h-4 bg-slate-600 rounded-r-md shrink-0 ml-1"></div>' +
          '</div>' +
          '<div class="text-xs text-center font-mono font-bold text-cyan-200 bg-cyan-950/30 border border-cyan-500/30 rounded-xl py-2 px-3">' +
          (summary.length ? ('Par côté : ' + summary.join(' + ')) : 'Aucun disque requis (Barre de ' + bar + ' kg)') +
          '</div>';
      };

      app.openMuscleRecoveryModal = function() {
        var state = window.IronPulse.Storage.getState();
        var history = (state && state.history) ? state.history : [];
        var now = Date.now();
        var groups = [
          { id: 'chest', label: 'Pectoraux & Poussée', icon: '🛡️', match: /bench|developpe|pompe|dip|chest|pec|incline/i, rec: 94 },
          { id: 'back', label: 'Dos & Tirage Lourd', icon: '🦅', match: /row|traction|pull|deadlift|souleve|dos|lat/i, rec: 88 },
          { id: 'legs', label: 'Jambes & Chaîne Post.', icon: '⚡', match: /squat|leg|presse|fente|mollet|rdl|hip/i, rec: 76 },
          { id: 'shoulders', label: 'Épaules & Deltoïdes', icon: '🔱', match: /ohp|militaire|lateral|epaule|shoulder/i, rec: 91 },
          { id: 'arms', label: 'Bras (Biceps & Triceps)', icon: '💪', match: /curl|triceps|extension|bras|skull/i, rec: 96 },
          { id: 'core', label: 'Sangle Abdominale', icon: '🔥', match: /abdo|plank|gainage|crunch|core/i, rec: 98 }
        ];
        history.slice(-6).forEach(function(sess, idx) {
          var ageHours = sess.date ? Math.max(2, (now - new Date(sess.date).getTime()) / 3600000) : ((6 - idx) * 14);
          if (ageHours < 72 && sess.exercises) {
            sess.exercises.forEach(function(ex) {
              var name = (ex.name || ex.exerciseId || '') + ' ' + (sess.name || '');
              var setsCount = (ex.sets && ex.sets.length) ? ex.sets.length : 3;
              var fatigueImpact = Math.max(0, Math.round((1 - ageHours / 72) * setsCount * 9));
              groups.forEach(function(g) {
                if (g.match.test(name)) {
                  g.rec = Math.max(32, Math.min(100, g.rec - fatigueImpact));
                }
              });
            });
          }
        });
        var freshGroup = groups.slice().sort(function(a, b) { return b.rec - a.rec; })[0];
        var old = document.getElementById('ipz-recovery-modal');
        if (old) old.remove();
        var div = document.createElement('div');
        div.id = 'ipz-recovery-modal';
        div.className = 'fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 animate-fade-in';
        div.innerHTML = '<div class="bg-[#0B101B] border-2 border-emerald-500/40 rounded-3xl w-full max-w-md p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">' +
          '<div class="flex items-center justify-between border-b border-slate-800 pb-3">' +
          '  <div><h3 class="text-base font-black text-white">🧬 Radar de Récupération 48h</h3><p class="text-[11px] text-slate-400">État de fraîcheur neuromusculaire calculé sur vos séances</p></div>' +
          '  <button onclick="var m=document.getElementById(\'ipz-recovery-modal\');if(m)m.remove();" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 font-bold">✕</button>' +
          '</div>' +
          '<div class="space-y-2.5">' +
          groups.map(function(g) {
            var status = g.rec >= 85 ? { txt: 'Prêt à l\'impact', col: 'bg-emerald-400', badge: 'text-emerald-300 border-emerald-500/40 bg-emerald-500/10' }
                       : (g.rec >= 60 ? { txt: 'Synthèse en cours', col: 'bg-amber-400', badge: 'text-amber-300 border-amber-500/40 bg-amber-500/10' }
                                      : { txt: 'Repos conseillé', col: 'bg-rose-500', badge: 'text-rose-300 border-rose-500/40 bg-rose-500/10' });
            return '<div class="p-3 rounded-2xl bg-slate-950/90 border border-slate-800 space-y-1.5">' +
              '<div class="flex items-center justify-between">' +
              '  <span class="text-xs font-extrabold text-white">' + g.icon + ' ' + g.label + '</span>' +
              '  <span class="text-[10px] font-mono font-black px-2 py-0.5 rounded-full border ' + status.badge + '">' + g.rec + '% • ' + status.txt + '</span>' +
              '</div>' +
              '<div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">' +
              '  <div class="h-full ' + status.col + ' rounded-full transition-all" style="width:' + g.rec + '%;"></div>' +
              '</div>' +
              '</div>';
          }).join('') +
          '</div>' +
          '<div class="p-3.5 rounded-2xl bg-emerald-950/30 border border-emerald-500/40 text-xs text-emerald-200">' +
          '  <div class="font-black uppercase text-[10px] text-emerald-300 mb-0.5">🎯 Recommandation Biomécanique du Jour</div>' +
          '  Votre zone la plus fraîche est <strong>' + freshGroup.label + ' (' + freshGroup.rec + '%)</strong>. Idéal pour viser un record 1RM ou un volume lourd aujourd\'hui.' +
          '</div>' +
          '</div>';
        document.body.appendChild(div);
      };

      app.renderVictoryCanvas = function() {
        var cv = document.getElementById('ipz-victory-canvas');
        if (!cv) return;
        var ctx = cv.getContext('2d');
        var state = window.IronPulse.Storage.getState();
        var hero = window.IronPulse.RPG ? window.IronPulse.RPG.getHeroProfile() : {};
        var name = ((state.profile && state.profile.name) ? state.profile.name : 'MEHDI').toUpperCase();
        var lvl = hero.level || 12;
        var cp = hero.combatPower || 6593;
        var streak = state.streakDays || 14;
        var gName = (state.rpg && state.rpg.guildName) ? state.rpg.guildName : 'Dojo ALTR Apex';
        var code = 'ALTR-' + name.replace(/[^A-Z0-9]/g, '').slice(0, 5) + '-77';
        var st = hero.stats || { strength: 78, vitality: 72, power: 84, endurance: 75, agility: 69, intelligence: 61 };

        var grad = ctx.createLinearGradient(0, 0, 540, 680);
        grad.addColorStop(0, '#050912');
        grad.addColorStop(0.5, '#0B1528');
        grad.addColorStop(1, '#060A14');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 540, 680);

        ctx.strokeStyle = 'rgba(6, 182, 212, 0.55)';
        ctx.lineWidth = 4;
        ctx.strokeRect(14, 14, 512, 652);

        ctx.fillStyle = '#06B6D4';
        ctx.font = '900 16px Inter, sans-serif';
        ctx.fillText('⚡ ALTHER FIT — CARTE D\'ÉVEIL ALTR', 36, 54);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 36px Inter, sans-serif';
        ctx.fillText('ALTR : ' + name + '  •  LV.' + lvl, 36, 105);

        ctx.fillStyle = '#F59E0B';
        ctx.font = '800 20px Inter, sans-serif';
        ctx.fillText('AURA & PUISSANCE : CP ' + cp + '   |   🔥 ' + streak + ' JOURS', 36, 140);

        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(36, 168, 468, 250);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
        ctx.lineWidth = 2;
        ctx.strokeRect(36, 168, 468, 250);

        var items = [
          ['STR (Force Pure)', st.strength || 78, '#06B6D4'],
          ['PWR (Explosivité)', st.power || 84, '#38BDF8'],
          ['VIT (Récupération)', st.vitality || 72, '#10B981'],
          ['END (Cardio & Volume)', st.endurance || 75, '#F59E0B'],
          ['AGI (Mobilité 3-1-1)', st.agility || 69, '#FBBF24'],
          ['INT (Précision 1RM)', st.intelligence || 61, '#818CF8']
        ];
        for (var i = 0; i < items.length; i++) {
          var y = 205 + i * 36;
          ctx.fillStyle = '#E2E8F0';
          ctx.font = '700 14px Inter, sans-serif';
          ctx.fillText(items[i][0], 56, y);
          ctx.fillStyle = '#1E293B';
          ctx.fillRect(235, y - 12, 200, 12);
          ctx.fillStyle = items[i][2];
          ctx.fillRect(235, y - 12, Math.min(200, items[i][1] * 2), 12);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 14px monospace';
          ctx.fillText(String(items[i][1]), 450, y);
        }

        ctx.fillStyle = 'rgba(6, 182, 212, 0.12)';
        ctx.fillRect(36, 444, 468, 120);
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)';
        ctx.strokeRect(36, 444, 468, 120);

        ctx.fillStyle = '#38BDF8';
        ctx.font = '800 14px Inter, sans-serif';
        ctx.fillText('GUILDE ACTIVE : ' + gName.toUpperCase(), 56, 480);

        ctx.fillStyle = '#FBBF24';
        ctx.font = '900 24px monospace';
        ctx.fillText('CODE INVITATION : ' + code, 56, 520);

        ctx.fillStyle = '#94A3B8';
        ctx.font = '600 13px Inter, sans-serif';
        ctx.fillText('Forge ton ALTR sur : ironpulse-pwa.vercel.app', 56, 548);

        ctx.fillStyle = '#64748B';
        ctx.font = '700 12px Inter, sans-serif';
        ctx.fillText('ALTHER FIT • TON ALTER EGO MUSCULATION & AURA 3D', 36, 635);
      };

              window.__current_tab = 'home';

            origFn.apply(this, arguments);

              if (window.__current_tab === 'home') renderAirFocusHomeScreen();
              else { syncFiveTabDock(); sanitizeDOMAndAssets(); }

    function dismissSplash() {
      var s = document.getElementById('ironpulse-splash');
      if (s) { s.style.opacity = '0'; setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 360); }
    }
    function tryBoot() {
      if (window.__ironpulse_ready) return true;
      if (window.IronPulse && window.IronPulse.App && window.IronPulse.Storage) {
        try {
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) {
                if (k !== 'alther-fit-v5.1-altr-clean') caches.delete(k);
              });
            }).catch(function(){});
          }
          var st = window.IronPulse.Storage.getState();
          if (st) {
            if (st.profile) st.profile.onboardingCompleted = true;
            if (st.rpg && st.rpg.appearance) st.rpg.appearance.visualMode = '2d';
            window.IronPulse.Storage.saveState();
          }
        } catch(e){}
        window.__ironpulse_ready = true;
        try { window.IronPulse.App.init(); } catch(e){ console.error(e); }
        setupAirFocusHooks();
        setTimeout(renderAirFocusHomeScreen, 30);
        dismissSplash();
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          navigator.serviceWorker.register('./sw.js?v=5.1').then(function(reg) {
            if (reg && reg.update) reg.update();
          }).catch(function(){});
        }
        return true;
      }
      return false;
    }
    function startApp() {
      if (tryBoot()) return;
      var itv = setInterval(function(){ if (tryBoot()) clearInterval(itv); }, 50);
      window.addEventListener('load', function(){ if (tryBoot()) clearInterval(itv); });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startApp);
    else startApp();
