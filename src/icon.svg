<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fond Obsidienne Profond avec Lueur d'Arène -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#182338" />
      <stop offset="55%" stop-color="#0E1524" />
      <stop offset="100%" stop-color="#060910" />
    </radialGradient>

    <!-- Énergie Or Saiyan Ki -->
    <linearGradient id="goldKi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Énergie Cyan Astral Chasseur -->
    <linearGradient id="cyanAstral" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <!-- Émeraude Vitalité / Pulse -->
    <linearGradient id="emeraldPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Lueur Néon (Glow Filter) -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond Squircle PWA -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />

  <!-- Liseré Extérieur High-Tech Biseauté -->
  <rect x="18" y="18" width="476" height="476" rx="100" fill="none" stroke="url(#cyanAstral)" stroke-width="2.5" stroke-opacity="0.35" />
  <rect x="26" y="26" width="460" height="460" rx="92" fill="none" stroke="#243048" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Aura Circulaire d'Énergie Pulse (Arène) -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#cyanAstral)" stroke-width="3" stroke-dasharray="14 8" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#goldKi)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Écussons Angulaires Mecha / Shonen (Coins d'Arène) -->
  <path d="M 120 75 L 85 75 L 85 110" fill="none" stroke="url(#cyanAstral)" stroke-width="4" stroke-linecap="round" />
  <path d="M 392 75 L 427 75 L 427 110" fill="none" stroke="url(#cyanAstral)" stroke-width="4" stroke-linecap="round" />
  <path d="M 120 437 L 85 437 L 85 402" fill="none" stroke="url(#cyanAstral)" stroke-width="4" stroke-linecap="round" />
  <path d="M 392 437 L 427 437 L 427 402" fill="none" stroke="url(#cyanAstral)" stroke-width="4" stroke-linecap="round" />

  <!-- Haltère Cybernétique Stylisée (Symbole Fonte & Force) -->
  <g id="dumbbellCore" opacity="0.95">
    <!-- Barre centrale en titane -->
    <rect x="156" y="244" width="200" height="24" rx="12" fill="#E2E8F0" filter="url(#subtleGlow)" />
    <!-- Disques gauches -->
    <rect x="146" y="196" width="22" height="120" rx="9" fill="url(#cyanAstral)" />
    <rect x="120" y="210" width="20" height="92" rx="8" fill="#1E293B" stroke="url(#cyanAstral)" stroke-width="2" />
    <!-- Disques droits -->
    <rect x="344" y="196" width="22" height="120" rx="9" fill="url(#cyanAstral)" />
    <rect x="372" y="210" width="20" height="92" rx="8" fill="#1E293B" stroke="url(#cyanAstral)" stroke-width="2" />
  </g>

  <!-- Le « Z » Héroïque & Éclair de Ki (Solo Leveling × DBZ) -->
  <g id="heroicZ" filter="url(#neonGlow)">
    <!-- Éclair central flamboyant -->
    <path d="M 315 108 L 198 252 L 278 252 L 182 404 L 334 228 L 254 228 Z"
          fill="url(#goldKi)"
          stroke="#FFFBEB"
          stroke-width="3"
          stroke-linejoin="round" />
  </g>

  <!-- Particules & Éclats d'Énergie Électrique -->
  <circle cx="205" cy="145" r="4.5" fill="#FDE68A" />
  <circle cx="330" cy="360" r="4.5" fill="#67E8F9" />
  <circle cx="150" cy="330" r="3" fill="#67E8F9" />
  <circle cx="365" cy="160" r="3" fill="#FDE68A" />

  <!-- Monogramme de Signature Subtile : AURA FIT (Arc inférieur) -->
  <text x="256" y="468" text-anchor="middle" font-family="'Chakra Petch', sans-serif" font-size="19" font-weight="900" letter-spacing="9" fill="#94A3B8" opacity="0.85">IRONPULSE Z</text>
</svg>
